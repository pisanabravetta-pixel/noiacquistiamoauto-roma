<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Noi Acquistiamo Auto Roma</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Valutazione auto usate a Roma. Vendita rapida e trasparente." />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #111; color: #fff; padding: 20px; text-align: center; }
    main { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; }
    h1 { margin-top: 0; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
    }
    button {
      background: #e63946;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #d62839; }
    footer { text-align: center; margin-top: 20px; color: #777; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <h1>Noi Acquistiamo Auto</h1>
  <p>Solo Roma e provincia</p>
</header>

<main>
  <h2>Valuta la tua auto</h2>

  <label>Marca</label>
  <input type="text" placeholder="Es. Fiat" />

  <label>Modello</label>
  <input type="text" placeholder="Es. Panda" />

  <label>Anno</label>
  <input type="number" placeholder="Es. 2018" />

  <label>Kilometri</label>
  <input type="number" placeholder="Es. 85000" />

  <button>Richiedi valutazione</button>
</main>

<footer>
  © NoiAcquistiamoAuto Roma
</footer>

</body>
</html>
